name: Native candidate
on:
  push:
    branches: [main, native-migration, codex/zenzip-0.4.0]
    paths: ['native/**', '.github/workflows/native-candidate.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-candidate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: windows-2022, arch: x64}
          - {os: windows-11-arm, arch: arm64}
          - {os: ubuntu-24.04, arch: x64}
          - {os: ubuntu-24.04-arm, arch: arm64}
          - {os: macos-15-intel, arch: x64}
          - {os: macos-15, arch: arm64}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      QT_QPA_PLATFORM: offscreen
      QT_QUICK_BACKEND: software
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Linux desktop runtime dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgl1-mesa-dev libegl1-mesa-dev libxkbcommon-dev libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-xinerama0 libxkbcommon-x11-0 libxcb-shape0 libxcb-xfixes0 libxcb-randr0 libxcb-sync1 libxcb-xinput0 patchelf squashfs-tools
      - run: python -m pip install aqtinstall==3.3.0 ninja==1.11.1.4
      - run: python -m pip install cmake==3.31.6
        if: runner.os != 'Windows' || matrix.arch != 'arm64'
      - run: python -m pip install cmake==4.2.3
        if: runner.os == 'Windows' && matrix.arch == 'arm64'
      - uses: actions/cache@v4
        id: qt-cache
        with:
          path: .native-build/Qt
          key: qt-6.8.3-${{ runner.os }}-${{ matrix.arch }}-base-declarative-tools-translations-icu-wayland-v2
      - run: python native/bootstrap/qt-sdk.py --arch ${{ matrix.arch }} --output .native-build/Qt
      - uses: actions/cache/save@v4
        if: steps.qt-cache.outputs.cache-hit != 'true'
        with:
          path: .native-build/Qt
          key: qt-6.8.3-${{ runner.os }}-${{ matrix.arch }}-base-declarative-tools-translations-icu-wayland-v2
      - run: python native/bootstrap/dependencies.py --arch ${{ matrix.arch }}
      - name: Configure full native application
        shell: bash
        run: |
          args=()
          if [[ "$RUNNER_OS" == Windows ]]; then
            if [[ '${{ matrix.arch }}' == arm64 ]]; then args+=(-G "Visual Studio 18 2026" -A ARM64); else args+=(-G "Visual Studio 17 2022" -A x64); fi
          elif [[ "$RUNNER_OS" == macOS ]]; then
            args+=(-DCMAKE_OSX_DEPLOYMENT_TARGET=13.0)
          fi
          if [[ -n "${QT_HOST_PATH:-}" ]]; then args+=(-DQT_HOST_PATH="$QT_HOST_PATH"); fi
          cmake -S native -B .native-build/candidate -DCMAKE_BUILD_TYPE=Release -DZENZIP_BUILD_GUI=ON -DZENZIP_HEAVY_TESTS=ON -DZENZIP_ENGINE_DIR="$GITHUB_WORKSPACE/native/.deps/engine/${{ matrix.arch }}" "${args[@]}"
      - run: cmake --build .native-build/candidate --config Release --parallel 3
      - run: python native/tools/prepare-translations.py
      - run: ctest --test-dir .native-build/candidate -C Release --output-on-failure
      - name: Native Qt window smoke
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == Windows ]]; then app=.native-build/candidate/bin/Release/zenzip.exe;
          elif [[ "$RUNNER_OS" == macOS ]]; then app=.native-build/candidate/bin/zenzip.app/Contents/MacOS/zenzip;
          else app=.native-build/candidate/bin/zenzip; fi
          "$app" --smoke native/tests/fixtures/sample.iso --screenshot .native-build/native-smoke.png
      - name: Capture paired languages and theme-scale acceptance matrix
        if: runner.os == 'Windows' && matrix.arch == 'x64'
        run: |
          python native/tools/prepare-capture-font.py .native-build/capture-font
          python native/tools/capture-native.py .native-build/candidate/bin/Release/zenzip.exe .native-build/screenshots --full --font-file .native-build/capture-font/NotoSansCJKsc-Regular.otf
      - name: Build and isolate-test offline candidate packages
        run: python native/packaging/package.py --build .native-build/candidate --arch ${{ matrix.arch }} --qt-prefix "${{ env.QT_PREFIX }}" --output .native-build/artifacts
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Verify Debian rename upgrade from the published REAzip package
        if: runner.os == 'Linux' && matrix.arch == 'x64'
        run: python native/tools/check-debian-upgrade.py .native-build/artifacts/ZENzip-0.4.0-linux-x64.deb .native-build/artifacts/ZENzip-0.4.0-linux-x64-upgrade.json
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-checks-${{ runner.os }}-${{ matrix.arch }}
          path: |
            .native-build/candidate/Testing/Temporary/LastTest.log
            .native-build/native-smoke.png
            .native-build/artifacts/*
            .native-build/screenshots/*
          if-no-files-found: ignore
  aggregate:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: native-checks-*
          path: candidates
      - name: Require every architecture and artifact format
        run: |
          python - <<'PY'
          import json,pathlib
          root=pathlib.Path('candidates');manifests=list(root.rglob('*-manifest.json'))
          expected={(os,arch) for os in ['windows','macos','linux'] for arch in ['x64','arm64']};found=set()
          for path in manifests:
              data=json.loads(path.read_text());found.add((data['os'],data['architecture']))
              required={'windows':{'.exe','.zip'},'macos':{'.dmg','.zip'},'linux':{'.AppImage','.deb','.gz'}}[data['os']]
              assert required<={pathlib.Path(item['file']).suffix for item in data['artifacts']}
          assert found==expected,(found,expected)
          assert len({json.loads(path.read_text())['sourceCommit'] for path in manifests})==1
          pathlib.Path('candidate-status.json').write_text(json.dumps({'sixTargetsBuilt':True,'publicReleaseAuthorized':True,'releaseGate':'six-target tests and documented desktop verification scope'},indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: aggregate-candidate-status
          path: candidate-status.json
