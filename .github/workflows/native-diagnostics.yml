name: Native disk diagnostics
on:
  push:
    branches: [native-migration]
    paths: ['.github/workflows/native-diagnostics.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  disk:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y gdb
      - run: python native/bootstrap/dependencies.py --arch x64
      - run: cmake -S native -B .native-build/diagnostics -DCMAKE_BUILD_TYPE=Debug -DREAZIP_BUILD_GUI=OFF -DREAZIP_ENGINE_DIR="$GITHUB_WORKSPACE/native/.deps/engine/x64"
      - run: cmake --build .native-build/diagnostics --target reazip-disk-test --parallel 3
      - run: ctest --test-dir .native-build/diagnostics -R native-disk-errors --output-on-failure
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: disk-diagnostics
          path: .native-build/diagnostics/Testing/Temporary/LastTest.log
